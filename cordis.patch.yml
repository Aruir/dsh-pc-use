# Insert the codex-cu plugin process-wide, so every agent preset gets the
# codex_js / codex_js_reset / codex_js_add_node_module_dir / codex_status tools
# without declaring anything in the preset.
#
# The entry name is PATH-RELATIVE on purpose: DSH anchors a relative `name:` to the
# directory of the patch file that declared it, so this row always loads this
# package's own index.js whatever the install folder is called.

- insert:
    - id: codex-cu
      name: './index.js'
      config:
        enabled: true
        # Fail closed by default: only Codex's "Allow Browser use to access <origin>?"
        # approval is accepted automatically; every other elicitation is declined.
        # Every approval is written to the log with its original wording, decision and
        # reason. Set true to auto-accept browser access again (everything else is
        # still declined).
        autoApprove: false
        # Windows desktop control (Codex Computer Use). Off by default; when on, every
        # desktop app must be approved in DSH the first time it is used.
        computer: false
        # Empty means %USERPROFILE%\.codex
        codexHome: ''
        # Empty means ~/.dsh/codex-cu.log; approvals are always logged, no longer
        # console.warn only.
        logFile: ''
        timeoutMs: 120000
        tools:
          js: true
          reset: true
          addNodeModuleDir: true
          status: true
