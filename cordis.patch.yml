# Insert the pc-use plugin process-wide, so every agent preset gets the
# pc_codex_js / pc_codex_js_reset / pc_codex_docs / pc_status tools plus the desktop
# tools (pc_codex_desktop_js / pc_codex_desktop_js_reset /
# pc_codex_desktop_js_add_node_module_dir) without declaring anything in the preset.
#
# The row is named after the package: the profile already records the package as
# `dsh-pc-use` (a `link:` dependency), so the Loader resolves the package entry and
# package-level display metadata (locale, icon) can be read.

- insert:
    - id: pc-use
      name: 'dsh-pc-use'
      config:
        enabled: true
        # Fail closed by default: only Codex's "Allow Browser use to access <origin>?"
        # approval is accepted automatically; every other elicitation is declined.
        # Every approval is written to the log with its original wording, decision and
        # reason. Set true to auto-accept browser access again (everything else is
        # still declined).
        autoApprove: false
        # Windows desktop control (Codex Computer Use). Off by default; when on, desktop
        # approvals follow DSH's approval policy ("full access" allows them directly).
        # Approvals are remembered per app within one DSH session while
        # rememberDesktopApprovals is true.
        computer: false
        rememberDesktopApprovals: true
        # Language of the plugin's own text: auto follows the DSH interface language;
        # zh / en force one.
        language: auto
        # Empty means %USERPROFILE%\.codex
        codexHome: ''
        # Empty means ~/.dsh/pc-use.log; approvals are always logged, no longer
        # console.warn only.
        logFile: ''
        timeoutMs: 120000
        tools:
          js: true
          reset: true
          # Desktop tools run on Codex's node_repl server; they need `computer: true` and
          # are not on the settings page.
          desktopJs: true
          desktopReset: true
          desktopAddNodeModuleDir: true
          docs: true
          status: true
